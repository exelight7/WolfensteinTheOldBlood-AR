name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pilot.txt

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve version
        shell: pwsh
        run: |
          $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match app version $version"
          }
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pilot.txt pytest
          python -m pip install pyinstaller==6.22.3

      - name: Prepare sidecar data
        run: python tools/prepare_release_data.py

      - name: Build sidecar
        run: python tools/build_sidecar.py

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Test and build app
        working-directory: app
        run: |
          npm run typecheck
          npm run lint
          npm run tauri build

      - name: Run repository gates
        run: |
          python -m pytest tests -q
          python tools/check_public_repo.py

      - name: Generate update manifest and checksums
        shell: pwsh
        run: |
          $built = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          if (-not $built) { throw "NSIS installer was not produced" }
          # GitHub replaces spaces in asset names; publish a canonical name so the
          # manifest URL always resolves.
          $installer = Join-Path $built.DirectoryName "WolfensteinAR-Manager-$env:VERSION-x64-setup.exe"
          Copy-Item -LiteralPath $built.FullName -Destination $installer -Force
          python -X utf8 tools/make_release_manifest.py `
            --installer $installer --tag $env:TAG `
            --output release/release-manifest.json
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $([IO.Path]::GetFileName($installer))" | Set-Content release/SHA256SUMS.txt -Encoding ascii
          "INSTALLER=$installer" >> $env:GITHUB_ENV

      - name: Verify installer bundles the sidecar
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "wtob-release-install"
          Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
          Start-Process -FilePath $env:INSTALLER -ArgumentList '/S',"/D=$target" -Wait
          if (-not (Test-Path "$target/resources/sidecar/wtob-build.exe")) {
            throw "Installed package is missing resources/sidecar/wtob-build.exe"
          }
          Start-Process -FilePath "$target/uninstall.exe" -ArgumentList '/S' -Wait

      - name: Remove superseded release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $keep = @(
            "WolfensteinAR-Manager-$env:VERSION-x64-setup.exe",
            "release-manifest.json",
            "SHA256SUMS.txt"
          )
          $existing = @(gh release view $env:TAG --json assets -q '.assets[].name' 2>$null)
          foreach ($name in $existing) {
            if ($name -and ($keep -notcontains $name)) {
              gh release delete-asset $env:TAG $name -y
            }
          }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wolfenstein-AR-Manager
          path: |
            app/src-tauri/target/release/bundle/nsis/WolfensteinAR-Manager-*-x64-setup.exe
            release/release-manifest.json
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Wolfenstein: The Old Blood — Arabic ${{ env.VERSION }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/src-tauri/target/release/bundle/nsis/WolfensteinAR-Manager-*-x64-setup.exe
            release/release-manifest.json
            release/SHA256SUMS.txt
