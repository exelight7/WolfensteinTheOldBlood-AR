<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ولفنشتاين: ذا أولد بلود — التعريب العربي</title>
  <desc id="desc">تصميم أصلي بألوان حمراء وسوداء وخطوط هندسية. إصدار عربي مع تثبيت بالبرنامج أو يدويًا.</desc>
  <defs>
