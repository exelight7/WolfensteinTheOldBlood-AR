    </linearGradient>
    <linearGradient id="red" x2="1" y2="1">
      <stop stop-color="#be2639"/>
      <stop offset="1" stop-color="#74101f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="14" fill="url(#grid)"/>
  <path d="M0 0H308L167 360H0Z" fill="url(#red)"/>
