  <path d="M0 274L186 87M0 311L204 107M35 360L222 173" stroke="#fddfe2" stroke-opacity=".12" stroke-width="2"/>
  <rect x="47" y="46" width="99" height="4" fill="#f7eeee"/>
  <path d="M47 62H115M47 73H93" stroke="#f7eeee" stroke-opacity=".5" stroke-width="2"/>
  <path d="M49 300H128M49 310H101" stroke="#f7eeee" stroke-opacity=".5" stroke-width="2"/>
