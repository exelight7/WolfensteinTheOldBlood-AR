[package]
name = "wolfenstein-ar-manager"
version = "1.0.0"
description = "Arabic localization manager for Wolfenstein: The Old Blood"
authors = ["kaitolight7 and contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "wolfenstein_ar_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
semver = "1"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
